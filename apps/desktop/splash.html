<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>IA_Coder</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #03060c;
        color: #cdefff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        text-align: center;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: 0.08em;
        background: linear-gradient(90deg, #22d3ee, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      small {
        display: block;
        margin-bottom: 22px;
        color: #6b7a90;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      #status {
        font-size: 12px;
        color: #94a3b8;
        min-height: 16px;
      }
      .ring {
        width: 34px;
        height: 34px;
        margin: 0 auto 16px;
        border: 3px solid rgba(34, 211, 238, 0.15);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ring"></div>
      <h1>IA_CODER</h1>
      <small>orquestrador de agentes</small>
      <div id="status">iniciando…</div>
    </div>
  </body>
</html>
